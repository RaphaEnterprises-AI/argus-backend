# Security Scanning Workflow
# Runs gitleaks to detect secrets in code and git history
#
# Triggers:
# - On every push to main/develop branches
# - On every pull request
# - Weekly scheduled scan of full history
#
# SECURITY: This workflow uses only fixed paths and trusted inputs.
# No user-controlled input is used in shell commands.

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  security-events: write  # For SARIF upload

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: true  # Add comments on PRs

      # Upload results to GitHub Security tab
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true  # Don't fail if SARIF upload fails

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python dependency scan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: |
          pip-audit --requirement requirements.txt --format json --output pip-audit.json || true
          echo "## Python Dependency Vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          if [ -f pip-audit.json ]; then
            python3 -c "
          import json
          with open('pip-audit.json') as f:
              try:
                  data = json.load(f)
                  if data:
                      for vuln in data:
                          print(f\"- **{vuln.get('name', 'unknown')}**: {vuln.get('vulns', [])}\")
                  else:
                      print('No vulnerabilities found!')
              except:
                  print('No vulnerabilities found!')
          " >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      # Node.js dependency scan (dashboard)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: |
          npm audit --json > npm-audit.json 2>&1 || true
          echo "## Dashboard Dependency Vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          if [ -f npm-audit.json ]; then
            python3 -c "
          import json
          with open('npm-audit.json') as f:
              try:
                  data = json.load(f)
                  vulns = data.get('vulnerabilities', {})
                  if vulns:
                      for name, info in vulns.items():
                          severity = info.get('severity', 'unknown')
                          print(f\"- **{name}** ({severity})\")
                  else:
                      print('No vulnerabilities found!')
              except:
                  print('No vulnerabilities found!')
          " >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

  secret-rotation-check:
    name: Check Secret Rotation Status
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'  # Only on weekly schedule

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for secrets that need rotation
        run: |
          echo "## Weekly Secret Rotation Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the following files for secrets that may need rotation:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check for hardcoded secrets in kubernetes manifests
          echo "### Kubernetes Secrets" >> "$GITHUB_STEP_SUMMARY"
          find data-layer/kubernetes -name "*.yaml" -exec grep -l "password\|secret\|key" {} \; 2>/dev/null | while read -r file; do
            echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Environment Files" >> "$GITHUB_STEP_SUMMARY"
          find . -name ".env*" -not -path "./node_modules/*" -not -path "./.venv/*" 2>/dev/null | while read -r file; do
            echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See [Secret Rotation Runbook](docs/security/SECRET_ROTATION_RUNBOOK.md) for rotation procedures." >> "$GITHUB_STEP_SUMMARY"

      - name: Create rotation reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `[Security] Weekly Secret Rotation Reminder - ${today}`;
            const body = `
            ## Weekly Security Reminder

            This is an automated reminder to review and rotate secrets as needed.

            ### Checklist
            - [ ] Review gitleaks scan results
            - [ ] Check if any secrets are approaching rotation deadline
            - [ ] Verify all production secrets are stored in secure vaults
            - [ ] Update secret rotation log

            ### Resources
            - [Secret Rotation Runbook](docs/security/SECRET_ROTATION_RUNBOOK.md)
            - [Gitleaks Configuration](.gitleaks.toml)
            `;

            // Check for existing open issue with same label
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,rotation-reminder'
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'rotation-reminder']
              });
            }
        continue-on-error: true
