{{- if .Values.seleniumGrid.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" . }}-selenium-hub
  labels:
    {{- include "argus.selenium.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ .Values.seleniumGrid.hub.replicas }}
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: selenium-hub
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: selenium-hub
    spec:
      containers:
        - name: hub
          image: "{{ .Values.seleniumGrid.hub.image.repository }}:{{ .Values.seleniumGrid.hub.image.tag }}"
          ports:
            - containerPort: 4442
              name: publish
            - containerPort: 4443
              name: subscribe
            - containerPort: 4444
              name: http
          env:
            - name: SE_EVENT_BUS_HOST
              value: "{{ include "argus.fullname" . }}-selenium-hub"
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "4442"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "4443"
          resources:
            {{- toYaml .Values.seleniumGrid.hub.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-selenium-hub
  labels:
    {{- include "argus.selenium.labels" . | nindent 4 }}
spec:
  type: {{ .Values.seleniumGrid.hub.service.type }}
  ports:
    - port: 4442
      targetPort: publish
      name: publish
    - port: 4443
      targetPort: subscribe
      name: subscribe
    - port: {{ .Values.seleniumGrid.hub.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: selenium-hub
{{- end }}
