# Argus Platform PrometheusRules
# Critical alerts for E2E Testing Platform infrastructure
#
# Deploy with: kubectl apply -f alerting-rules.yaml
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argus-platform-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: argus-alerts
    app.kubernetes.io/part-of: argus
    release: monitoring  # Required for Prometheus Operator to pick up rules
spec:
  groups:
    # =========================================================================
    # Cognee Worker Alerts
    # =========================================================================
    - name: cognee-worker
      interval: 30s
      rules:
        - alert: CogneeWorkerDown
          expr: up{job="cognee-worker"} == 0
          for: 5m
          labels:
            severity: critical
            component: cognee-worker
          annotations:
            summary: "Cognee worker is down"
            description: "Cognee worker {{ $labels.pod }} has been down for more than 5 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/cognee-worker-down"

        - alert: CogneeWorkerHighErrorRate
          expr: |
            (
              sum(rate(cognee_events_processed_total{status="error"}[5m])) by (pod)
              /
              sum(rate(cognee_events_processed_total[5m])) by (pod)
            ) > 0.1
          for: 5m
          labels:
            severity: warning
            component: cognee-worker
          annotations:
            summary: "Cognee worker has high error rate"
            description: "Cognee worker {{ $labels.pod }} has error rate > 10% for the last 5 minutes (current: {{ $value | humanizePercentage }})"

        - alert: CogneeKafkaConsumerNotRunning
          expr: cognee_kafka_consumer_running == 0
          for: 2m
          labels:
            severity: critical
            component: cognee-worker
          annotations:
            summary: "Cognee Kafka consumer is not running"
            description: "Cognee worker {{ $labels.pod }} Kafka consumer has stopped for more than 2 minutes."

        - alert: CogneeHighProcessingLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(cognee_event_processing_duration_seconds_bucket[5m])) by (le, pod)
            ) > 30
          for: 10m
          labels:
            severity: warning
            component: cognee-worker
          annotations:
            summary: "Cognee event processing is slow"
            description: "Cognee worker {{ $labels.pod }} P95 processing latency > 30s (current: {{ $value | humanizeDuration }})"

        - alert: CogneeGraphBuildErrors
          expr: |
            sum(rate(cognee_graph_operations_total{status="error"}[15m])) by (pod) > 0
          for: 15m
          labels:
            severity: warning
            component: cognee-worker
          annotations:
            summary: "Cognee graph build errors"
            description: "Cognee worker {{ $labels.pod }} has persistent graph build errors in the last 15 minutes."

    # =========================================================================
    # Data Layer Alerts (FalkorDB, Valkey, Redpanda)
    # =========================================================================
    - name: data-layer
      interval: 30s
      rules:
        - alert: FalkorDBDown
          expr: up{job="falkordb"} == 0
          for: 2m
          labels:
            severity: critical
            component: falkordb
          annotations:
            summary: "FalkorDB is down"
            description: "FalkorDB instance {{ $labels.pod }} has been down for more than 2 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/falkordb-down"

        - alert: FalkorDBHighMemory
          expr: |
            redis_memory_used_bytes{job="falkordb"}
            /
            redis_memory_max_bytes{job="falkordb"} > 0.85
          for: 10m
          labels:
            severity: warning
            component: falkordb
          annotations:
            summary: "FalkorDB memory usage high"
            description: "FalkorDB {{ $labels.pod }} memory usage > 85% (current: {{ $value | humanizePercentage }})"

        - alert: FalkorDBHighConnections
          expr: redis_connected_clients{job="falkordb"} > 100
          for: 5m
          labels:
            severity: warning
            component: falkordb
          annotations:
            summary: "FalkorDB high connection count"
            description: "FalkorDB {{ $labels.pod }} has {{ $value }} connected clients."

        - alert: ValkeyDown
          expr: up{job="valkey"} == 0
          for: 2m
          labels:
            severity: critical
            component: valkey
          annotations:
            summary: "Valkey cache is down"
            description: "Valkey instance {{ $labels.pod }} has been down for more than 2 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/valkey-down"

        - alert: ValkeyHighMemory
          expr: |
            redis_memory_used_bytes{job="valkey"}
            /
            redis_memory_max_bytes{job="valkey"} > 0.85
          for: 10m
          labels:
            severity: warning
            component: valkey
          annotations:
            summary: "Valkey memory usage high"
            description: "Valkey {{ $labels.pod }} memory usage > 85% (current: {{ $value | humanizePercentage }})"

        - alert: RedpandaClusterUnhealthy
          expr: redpanda_cluster_partitions_underreplicated > 0
          for: 5m
          labels:
            severity: critical
            component: redpanda
          annotations:
            summary: "Redpanda cluster has underreplicated partitions"
            description: "Redpanda has {{ $value }} underreplicated partitions for more than 5 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/redpanda-underreplicated"

        - alert: RedpandaBrokerDown
          expr: up{job="redpanda"} == 0
          for: 2m
          labels:
            severity: critical
            component: redpanda
          annotations:
            summary: "Redpanda broker is down"
            description: "Redpanda broker {{ $labels.pod }} has been down for more than 2 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/redpanda-broker-down"

        - alert: RedpandaHighConsumerLag
          expr: |
            max(kafka_consumer_group_lag{group="argus-cognee-workers"}) by (topic) > 1000
          for: 10m
          labels:
            severity: warning
            component: redpanda
          annotations:
            summary: "High Kafka consumer lag"
            description: "Consumer group argus-cognee-workers has lag > 1000 on topic {{ $labels.topic }} (current: {{ $value }})"

        - alert: RedpandaHighDiskUsage
          expr: |
            redpanda_storage_disk_used_bytes
            /
            redpanda_storage_disk_total_bytes > 0.80
          for: 15m
          labels:
            severity: warning
            component: redpanda
          annotations:
            summary: "Redpanda disk usage high"
            description: "Redpanda broker {{ $labels.pod }} disk usage > 80% (current: {{ $value | humanizePercentage }})"

    # =========================================================================
    # Browser Pool Alerts
    # =========================================================================
    - name: browser-pool
      interval: 30s
      rules:
        - alert: BrowserManagerDown
          expr: up{job="browser-manager"} == 0
          for: 2m
          labels:
            severity: critical
            component: browser-manager
          annotations:
            summary: "Browser manager is down"
            description: "Browser manager {{ $labels.pod }} has been down for more than 2 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/browser-manager-down"

        - alert: BrowserWorkerDown
          expr: up{job="browser-worker"} == 0
          for: 2m
          labels:
            severity: warning
            component: browser-worker
          annotations:
            summary: "Browser worker is down"
            description: "Browser worker {{ $labels.pod }} has been down for more than 2 minutes."

        - alert: AllBrowserWorkersDown
          expr: count(up{job="browser-worker"} == 1) == 0
          for: 2m
          labels:
            severity: critical
            component: browser-pool
          annotations:
            summary: "All browser workers are down"
            description: "No browser workers are available. Test execution is blocked."
            runbook_url: "https://docs.skopaq.ai/runbooks/browser-pool-down"

        - alert: BrowserPoolCapacityLow
          expr: |
            sum(browser_pool_available_browsers)
            /
            sum(browser_pool_max_browsers) < 0.2
          for: 10m
          labels:
            severity: warning
            component: browser-pool
          annotations:
            summary: "Browser pool capacity low"
            description: "Less than 20% browser capacity available (current: {{ $value | humanizePercentage }})"

        - alert: BrowserSessionsStuck
          expr: browser_sessions_active > 50
          for: 15m
          labels:
            severity: warning
            component: browser-pool
          annotations:
            summary: "High number of active browser sessions"
            description: "{{ $value }} browser sessions active for > 15 minutes. Sessions may be stuck."

    # =========================================================================
    # Langfuse/LLM Observability Alerts
    # =========================================================================
    - name: llm-observability
      interval: 1m
      rules:
        - alert: LangfuseDown
          expr: up{job="langfuse"} == 0
          for: 5m
          labels:
            severity: warning
            component: langfuse
          annotations:
            summary: "Langfuse observability is down"
            description: "Langfuse {{ $labels.pod }} has been down for more than 5 minutes. LLM tracing is unavailable."

        - alert: HighLLMCostRate
          expr: |
            sum(rate(langfuse_tokens_total{type="output"}[1h])) * 0.000015
            +
            sum(rate(langfuse_tokens_total{type="input"}[1h])) * 0.000003 > 10
          for: 30m
          labels:
            severity: warning
            component: llm
          annotations:
            summary: "High LLM cost rate"
            description: "Estimated LLM cost rate > $10/hour for the last 30 minutes."

        - alert: HighLLMErrorRate
          expr: |
            sum(rate(langfuse_requests_total{status="error"}[15m]))
            /
            sum(rate(langfuse_requests_total[15m])) > 0.05
          for: 15m
          labels:
            severity: warning
            component: llm
          annotations:
            summary: "High LLM API error rate"
            description: "LLM API error rate > 5% for the last 15 minutes (current: {{ $value | humanizePercentage }})"

    # =========================================================================
    # General Platform Health Alerts
    # =========================================================================
    - name: platform-health
      interval: 1m
      rules:
        - alert: ArgusNamespacePodsCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"argus-.*|browser-pool"}[1h]) > 5
          for: 5m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "Pod crash looping in Argus namespace"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last hour."

        - alert: ArgusNamespaceHighCPU
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace=~"argus-.*|browser-pool"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{resource="cpu", namespace=~"argus-.*|browser-pool"}) by (pod) > 0.9
          for: 15m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "High CPU usage in Argus workload"
            description: "Pod {{ $labels.pod }} CPU usage > 90% of limit for 15 minutes."

        - alert: ArgusNamespaceHighMemory
          expr: |
            sum(container_memory_working_set_bytes{namespace=~"argus-.*|browser-pool"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{resource="memory", namespace=~"argus-.*|browser-pool"}) by (pod) > 0.9
          for: 15m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "High memory usage in Argus workload"
            description: "Pod {{ $labels.pod }} memory usage > 90% of limit for 15 minutes."

        - alert: ArgusPVCNearFull
          expr: |
            kubelet_volume_stats_used_bytes{namespace=~"argus-.*|monitoring"}
            /
            kubelet_volume_stats_capacity_bytes{namespace=~"argus-.*|monitoring"} > 0.85
          for: 15m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "PVC near capacity"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is > 85% full (current: {{ $value | humanizePercentage }})"

    # =========================================================================
    # Intelligence Layer (UIIL) Alerts
    # =========================================================================
    - name: intelligence-layer
      interval: 30s
      rules:
        - alert: IntelligenceHighLLMFallbackRate
          expr: |
            (
              sum(rate(intelligence_llm_fallback_total[5m]))
              /
              sum(rate(intelligence_queries_total[5m]))
            ) > 0.20
          for: 10m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Intelligence layer LLM fallback rate too high"
            description: "More than 20% of intelligence queries are falling back to LLM (current: {{ $value | humanizePercentage }}). Check cache hit rates and vector search confidence."
            runbook_url: "https://docs.skopaq.ai/runbooks/intelligence-high-llm-fallback"

        - alert: IntelligenceLowCacheHitRate
          expr: |
            (
              sum(rate(intelligence_cache_hits_total[5m]))
              /
              (sum(rate(intelligence_cache_hits_total[5m])) + sum(rate(intelligence_cache_misses_total[5m])))
            ) < 0.50
          for: 15m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Intelligence cache hit rate below target"
            description: "Cache hit rate is below 50% (current: {{ $value | humanizePercentage }}). Consider warming cache or adjusting TTLs."

        - alert: IntelligenceHighQueryLatency
          expr: |
            histogram_quantile(0.95, sum(rate(intelligence_query_duration_seconds_bucket[5m])) by (le)) > 0.2
          for: 10m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Intelligence query latency too high"
            description: "P95 query latency exceeds 200ms for 10 minutes (current: {{ $value | humanizeDuration }}). Target is <100ms."

        - alert: IntelligencePrecomputedDataStale
          expr: |
            (intelligence_precomputed_valid_until - time()) < 0
          for: 30m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Precomputed intelligence data is stale"
            description: "Precomputed data for {{ $labels.type }} has expired. Queries will fall back to real-time computation."

        - alert: IntelligenceVectorSearchSlow
          expr: |
            histogram_quantile(0.95, sum(rate(intelligence_query_duration_seconds_bucket{tier="vector"}[5m])) by (le)) > 0.1
          for: 10m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Vector search latency too high"
            description: "Cognee vector search P95 latency exceeds 100ms (current: {{ $value | humanizeDuration }}). Check Cognee/Neo4j health."

        - alert: IntelligenceQueryRouterErrors
          expr: |
            sum(rate(intelligence_query_errors_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Intelligence query router errors detected"
            description: "Query router is experiencing errors at {{ $value | humanize }}/sec. Check logs for details."

        - alert: IntelligenceCriticalLLMFallbackRate
          expr: |
            (
              sum(rate(intelligence_llm_fallback_total[5m]))
              /
              sum(rate(intelligence_queries_total[5m]))
            ) > 0.40
          for: 5m
          labels:
            severity: critical
            component: intelligence
          annotations:
            summary: "CRITICAL: Intelligence layer degraded to LLM mode"
            description: "More than 40% of queries falling back to LLM. System performance severely degraded. Immediate investigation required."
            runbook_url: "https://docs.skopaq.ai/runbooks/intelligence-critical-llm-fallback"

        - alert: ValkeyCacheDown
          expr: up{job="valkey"} == 0
          for: 2m
          labels:
            severity: critical
            component: intelligence
          annotations:
            summary: "Valkey cache is down"
            description: "Valkey cache is unavailable. All queries will skip Tier 1 caching, causing increased latency."

        - alert: ValkeyCacheHighMemory
          expr: |
            valkey_used_memory_bytes / valkey_maxmemory_bytes > 0.9
          for: 10m
          labels:
            severity: warning
            component: intelligence
          annotations:
            summary: "Valkey cache memory usage high"
            description: "Valkey is using more than 90% of allocated memory (current: {{ $value | humanizePercentage }}). Consider increasing memory or reducing TTLs."

    # =========================================================================
    # Backend API Alerts (Railway-deployed FastAPI)
    # =========================================================================
    - name: backend-api
      interval: 30s
      rules:
        - alert: BackendAPIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="argus-backend", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="argus-backend"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            component: backend-api
            team: platform
          annotations:
            summary: "Backend API error rate above 5%"
            description: "Backend API has {{ $value | humanizePercentage }} error rate for the last 5 minutes. Check Railway logs for details."
            runbook_url: "https://docs.skopaq.ai/runbooks/backend-api-errors"

        - alert: BackendAPIHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{job="argus-backend"}[5m])) by (le)
            ) > 2
          for: 10m
          labels:
            severity: warning
            component: backend-api
            team: platform
          annotations:
            summary: "Backend API P95 latency above 2 seconds"
            description: "Backend API P95 latency is {{ $value | humanizeDuration }}. Check for slow database queries or external API calls."

        - alert: BackendAPICriticalLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{job="argus-backend"}[5m])) by (le)
            ) > 10
          for: 5m
          labels:
            severity: critical
            component: backend-api
            team: platform
          annotations:
            summary: "Backend API P99 latency critically high"
            description: "Backend API P99 latency is {{ $value | humanizeDuration }}. Immediate investigation required."
            runbook_url: "https://docs.skopaq.ai/runbooks/backend-api-latency"

        - alert: BackendAPIHealthCheckFailing
          expr: probe_success{job="argus-backend-healthcheck"} == 0
          for: 2m
          labels:
            severity: critical
            component: backend-api
            team: platform
          annotations:
            summary: "Backend API health check failing"
            description: "Backend API health endpoint has been failing for more than 2 minutes."
            runbook_url: "https://docs.skopaq.ai/runbooks/backend-api-health"

        - alert: BackendAPIRateLimitExceeded
          expr: |
            sum(rate(http_requests_total{job="argus-backend", status="429"}[5m])) > 10
          for: 5m
          labels:
            severity: warning
            component: backend-api
            team: platform
          annotations:
            summary: "Backend API rate limiting active"
            description: "Backend API is returning rate limit responses at {{ $value }}/sec. Check for misbehaving clients."

    # =========================================================================
    # Agent-to-Agent (A2A) Communication Alerts
    # =========================================================================
    - name: a2a-agents
      interval: 30s
      rules:
        - alert: A2AHighRequestLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(a2a_request_duration_seconds_bucket[5m])) by (le, from_agent, to_agent)
            ) > 5
          for: 5m
          labels:
            severity: warning
            component: a2a
            team: platform
          annotations:
            summary: "A2A request latency high"
            description: "Agent {{ $labels.from_agent }} -> {{ $labels.to_agent }} P95 latency is {{ $value | humanizeDuration }}."

        - alert: A2AHighErrorRate
          expr: |
            (
              sum(rate(a2a_requests_total{status="error"}[5m])) by (from_agent, to_agent)
              /
              sum(rate(a2a_requests_total[5m])) by (from_agent, to_agent)
            ) > 0.1
          for: 5m
          labels:
            severity: warning
            component: a2a
            team: platform
          annotations:
            summary: "A2A communication error rate high"
            description: "Agent {{ $labels.from_agent }} -> {{ $labels.to_agent }} error rate is {{ $value | humanizePercentage }}."

        - alert: A2AAgentUnhealthy
          expr: |
            (time() - a2a_agent_last_heartbeat_timestamp) > 120
          for: 2m
          labels:
            severity: warning
            component: a2a
            team: platform
          annotations:
            summary: "A2A agent heartbeat missing"
            description: "Agent {{ $labels.agent_type }} has not sent a heartbeat in {{ $value | humanizeDuration }}."

        - alert: A2ACircuitBreakerOpen
          expr: a2a_circuit_breaker_state{state="open"} == 1
          for: 1m
          labels:
            severity: critical
            component: a2a
            team: platform
          annotations:
            summary: "A2A circuit breaker open"
            description: "Circuit breaker for agent {{ $labels.agent_type }} is open. Agent-to-agent communication is degraded."
            runbook_url: "https://docs.skopaq.ai/runbooks/a2a-circuit-breaker"

        - alert: A2AKafkaTopicLag
          expr: |
            max(kafka_consumer_group_lag{group=~"argus-agent-.*"}) by (topic, group) > 500
          for: 10m
          labels:
            severity: warning
            component: a2a
            team: platform
          annotations:
            summary: "A2A Kafka consumer lag high"
            description: "Consumer group {{ $labels.group }} has lag > 500 on topic {{ $labels.topic }} (current: {{ $value }})."

    # =========================================================================
    # Test Execution Alerts
    # =========================================================================
    - name: test-execution
      interval: 1m
      rules:
        - alert: TestExecutionHighFailureRate
          expr: |
            (
              sum(rate(test_executions_total{status="failed"}[15m]))
              /
              sum(rate(test_executions_total[15m]))
            ) > 0.3
          for: 15m
          labels:
            severity: warning
            component: test-execution
            team: qa
          annotations:
            summary: "Test failure rate above 30%"
            description: "Test failure rate is {{ $value | humanizePercentage }} over the last 15 minutes. Investigate recent code changes."

        - alert: TestExecutionQueueBacklog
          expr: test_execution_queue_size > 100
          for: 15m
          labels:
            severity: warning
            component: test-execution
            team: platform
          annotations:
            summary: "Test execution queue backlog"
            description: "{{ $value }} tests waiting in queue. Consider scaling browser workers."

        - alert: SelfHealingHighFailureRate
          expr: |
            (
              sum(rate(self_healing_attempts_total{status="failed"}[1h]))
              /
              sum(rate(self_healing_attempts_total[1h]))
            ) > 0.5
          for: 30m
          labels:
            severity: warning
            component: self-healing
            team: platform
          annotations:
            summary: "Self-healing success rate below 50%"
            description: "Self-healing is failing {{ $value | humanizePercentage }} of the time. Review healing patterns in Cognee."

        - alert: FlakyTestsDetected
          expr: |
            count(
              (
                sum(rate(test_executions_total{status="passed"}[24h])) by (test_id)
                /
                sum(rate(test_executions_total[24h])) by (test_id)
              ) > 0.3 and
              (
                sum(rate(test_executions_total{status="passed"}[24h])) by (test_id)
                /
                sum(rate(test_executions_total[24h])) by (test_id)
              ) < 0.7
            ) > 10
          for: 1h
          labels:
            severity: warning
            component: test-execution
            team: qa
          annotations:
            summary: "High number of flaky tests detected"
            description: "{{ $value }} tests are showing flaky behavior (30-70% pass rate). Review in dashboard."

    # =========================================================================
    # Database/Supabase Alerts
    # =========================================================================
    - name: database
      interval: 1m
      rules:
        - alert: DatabaseConnectionPoolExhausted
          expr: |
            (
              pg_stat_activity_count{job="supabase-postgres"}
              /
              pg_settings_max_connections{job="supabase-postgres"}
            ) > 0.85
          for: 5m
          labels:
            severity: critical
            component: database
            team: platform
          annotations:
            summary: "Database connection pool near exhaustion"
            description: "Database is using {{ $value | humanizePercentage }} of available connections. Immediate action required."
            runbook_url: "https://docs.skopaq.ai/runbooks/database-connections"

        - alert: DatabaseHighQueryLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(pg_stat_statements_seconds_bucket{job="supabase-postgres"}[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
            component: database
            team: platform
          annotations:
            summary: "Database query latency high"
            description: "P95 database query latency is {{ $value | humanizeDuration }}. Review slow queries."

        - alert: DatabaseReplicationLag
          expr: pg_replication_lag{job="supabase-postgres"} > 30
          for: 5m
          labels:
            severity: critical
            component: database
            team: platform
          annotations:
            summary: "Database replication lag critical"
            description: "Replication lag is {{ $value }} seconds. Data consistency at risk."
            runbook_url: "https://docs.skopaq.ai/runbooks/database-replication"

        - alert: DatabaseDiskSpaceLow
          expr: |
            (
              pg_database_size_bytes{job="supabase-postgres"}
              /
              pg_settings_data_directory_capacity_bytes{job="supabase-postgres"}
            ) > 0.8
          for: 15m
          labels:
            severity: warning
            component: database
            team: platform
          annotations:
            summary: "Database disk space running low"
            description: "Database is using {{ $value | humanizePercentage }} of allocated storage."

    # =========================================================================
    # Cost & Budget Alerts
    # =========================================================================
    - name: cost-alerts
      interval: 5m
      rules:
        - alert: DailyAICostExceeded
          expr: |
            sum(increase(ai_cost_total_usd[24h])) > 100
          for: 5m
          labels:
            severity: warning
            component: cost
            team: platform
          annotations:
            summary: "Daily AI cost exceeded $100"
            description: "AI spending is ${{ $value }} in the last 24 hours. Review high-cost operations."

        - alert: HourlyAICostSpike
          expr: |
            sum(rate(ai_cost_total_usd[1h])) * 24 > 200
          for: 15m
          labels:
            severity: critical
            component: cost
            team: platform
          annotations:
            summary: "AI cost rate unsustainable"
            description: "Current AI spend rate projects to ${{ $value }} per day. Investigate immediately."
            runbook_url: "https://docs.skopaq.ai/runbooks/ai-cost-spike"

        - alert: OrganizationBudgetWarning
          expr: |
            (
              sum(ai_cost_total_usd) by (org_id)
              /
              sum(ai_budget_limit_usd) by (org_id)
            ) > 0.8
          for: 5m
          labels:
            severity: warning
            component: cost
            team: platform
          annotations:
            summary: "Organization approaching budget limit"
            description: "Organization {{ $labels.org_id }} has used {{ $value | humanizePercentage }} of AI budget."
