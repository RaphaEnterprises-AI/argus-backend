# kube-prometheus-stack Helm Values
# Industry-grade monitoring for Argus E2E Testing Platform
#
# Deploy with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f kube-prometheus-stack-values.yaml

# =============================================================================
# Global Settings
# =============================================================================
fullnameOverride: "monitoring"

# =============================================================================
# Prometheus
# =============================================================================
prometheus:
  prometheusSpec:
    # Scrape all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Resource limits
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m

    # Retention
    retention: 15d
    retentionSize: "10GB"

    # Storage - 50GB persistent volume
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: vultr-block-storage-hdd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Additional scrape configs for external targets (if needed)
    additionalScrapeConfigs: []

  # Service - ClusterIP only (no public access)
  service:
    type: ClusterIP

# =============================================================================
# Alertmanager
# =============================================================================
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m

    # Storage (Vultr minimum is 40GB)
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: vultr-block-storage-hdd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi

    # Mount secrets for notification credentials
    secrets:
      - alertmanager-secrets

    # Mount templates ConfigMap
    configMaps:
      - alertmanager-templates

  # Service - ClusterIP only
  service:
    type: ClusterIP

  # Template files path
  templateFiles:
    argus.tmpl: |-
      {{ define "slack.argus.title" -}}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
      {{- end }}
      {{ define "slack.argus.text" -}}
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Severity:* `{{ .Labels.severity }}`
      *Component:* `{{ .Labels.component }}`
      {{ if .Labels.pod }}*Pod:* `{{ .Labels.pod }}`{{ end }}
      {{ if .Labels.namespace }}*Namespace:* `{{ .Labels.namespace }}`{{ end }}
      {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>{{ end }}
      ---
      {{ end }}
      {{- end }}

  # Full AlertManager configuration with escalation policies
  # See alertmanager-config.yaml for detailed documentation
  config:
    global:
      resolve_timeout: 5m

    templates:
      - '/etc/alertmanager/config/*.tmpl'

    # Inhibition rules: suppress lower-severity when higher-severity fires
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'component']
      - source_match:
          alertname: 'CogneeWorkerDown'
        target_match_re:
          alertname: 'Cognee.*'
        equal: ['pod']
      - source_match:
          alertname: 'AllBrowserWorkersDown'
        target_match:
          alertname: 'BrowserWorkerDown'
      - source_match:
          alertname: 'BackendAPIHealthCheckFailing'
        target_match_re:
          alertname: 'BackendAPI.*Latency'

    # Routing tree with escalation policies
    route:
      receiver: 'default-slack'
      group_by: ['alertname', 'component', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Critical alerts: PagerDuty + Slack, fast escalation
        - match:
            severity: critical
          receiver: 'critical-pagerduty'
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
          continue: true
        - match:
            severity: critical
          receiver: 'critical-slack'
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h

        # Warning alerts: Slack only
        - match:
            severity: warning
          receiver: 'warning-slack'
          group_wait: 1m
          group_interval: 5m
          repeat_interval: 4h

        # Team-specific routing
        - match:
            team: platform
          receiver: 'platform-team-slack'
        - match:
            team: qa
          receiver: 'qa-team-slack'
        - match:
            component: database
          receiver: 'database-slack'
        - match:
            component: cost
          receiver: 'billing-slack'

    # Receivers (notification channels)
    # Secrets are mounted from alertmanager-secrets
    receivers:
      - name: 'default-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
            channel: '#argus-alerts'
            send_resolved: true
            title: '{{ template "slack.argus.title" . }}'
            text: '{{ template "slack.argus.text" . }}'

      - name: 'critical-pagerduty'
        pagerduty_configs:
          - routing_key_file: '/etc/alertmanager/secrets/alertmanager-secrets/pagerduty-routing-key'
            severity: critical
            description: '{{ .CommonAnnotations.summary }}'

      - name: 'critical-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url-critical'
            channel: '#argus-critical'
            send_resolved: true
            title: ':rotating_light: CRITICAL: {{ .CommonLabels.alertname }}'
            text: '{{ template "slack.argus.text" . }}'
            color: 'danger'

      - name: 'warning-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
            channel: '#argus-alerts'
            send_resolved: true
            title: ':warning: {{ .CommonLabels.alertname }}'
            text: '{{ template "slack.argus.text" . }}'
            color: 'warning'

      - name: 'platform-team-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
            channel: '#platform-alerts'
            send_resolved: true

      - name: 'qa-team-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
            channel: '#qa-alerts'
            send_resolved: true

      - name: 'database-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
            channel: '#database-alerts'
            send_resolved: true

      - name: 'billing-slack'
        slack_configs:
          - api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
            channel: '#billing-alerts'
            send_resolved: true

# =============================================================================
# Grafana
# =============================================================================
grafana:
  # Admin credentials - override via --set or external secret
  adminUser: admin
  # adminPassword will be auto-generated if not set
  # Set via: --set grafana.adminPassword=<secure-password>

  # Service - ClusterIP only (access via backend proxy)
  service:
    type: ClusterIP

  # Resource limits
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Persistence (Vultr minimum is 40GB)
  persistence:
    enabled: true
    storageClassName: vultr-block-storage-hdd
    size: 40Gi

  # Sidecar for dashboard provisioning only
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      # Fix SSL cert verification issue with K8s API
      skipTlsVerify: true
      # Explicitly set env var for k8s-sidecar
      env:
        SKIP_TLS_VERIFY: "true"
    # Disable sidecar for datasources - we use explicit config below
    datasources:
      enabled: false

  # Explicit datasource configuration with the UID our dashboards expect
  # This is the ONLY datasource definition - no sidecar, no chart defaults
  datasources:
    datasources.yaml:
      apiVersion: 1
      # Delete any existing datasources not in this file
      deleteDatasources:
        - name: Prometheus
          orgId: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://monitoring-prometheus.monitoring:9090
          access: proxy
          isDefault: true
          editable: false
          jsonData:
            httpMethod: POST
            timeInterval: 30s

  # Grafana.ini settings
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
    security:
      allow_embedding: true
    # Anonymous access enabled - Cloudflare Access handles authentication
    # Users must pass CF Access auth before reaching Grafana
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    # Disable Grafana's login page (CF Access is the login)
    auth:
      disable_login_form: true
    users:
      viewers_can_edit: false
    # Enable service accounts for API access
    service_accounts:
      enabled: true

# =============================================================================
# Node Exporter (host metrics)
# =============================================================================
nodeExporter:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# =============================================================================
# Kube State Metrics (K8s object metrics)
# =============================================================================
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# =============================================================================
# Prometheus Operator
# =============================================================================
prometheusOperator:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# =============================================================================
# Default Rules (pre-built alerting rules)
# =============================================================================
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # Not using etcd directly
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false  # Managed by Vultr
    kubelet: true
    kubeProxy: false  # Managed by Vultr
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false  # Managed by Vultr
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# =============================================================================
# Component Scraping (managed K8s - disable some)
# =============================================================================
kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false  # Managed by Vultr VKE

kubeScheduler:
  enabled: false  # Managed by Vultr VKE

kubeProxy:
  enabled: false  # Managed by Vultr VKE

kubeEtcd:
  enabled: false  # Managed by Vultr VKE

# =============================================================================
# Thanos (optional - for long-term storage)
# =============================================================================
thanosRuler:
  enabled: false
