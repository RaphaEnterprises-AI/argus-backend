app = 'skopaq-falkordb'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'falkordb_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 6379
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 6379

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  size = 'performance-1x'
  memory = 2048
