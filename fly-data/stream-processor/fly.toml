app = 'skopaq-stream-processor'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Kafka (Redpanda Cloud) — secrets set via `fly secrets`
  KAFKA_SECURITY_PROTOCOL = 'SASL_SSL'
  KAFKA_SASL_MECHANISM = 'SCRAM-SHA-256'
  KAFKA_CONSUMER_GROUP = 'argus-stream-processor'
  KAFKA_AUTO_OFFSET_RESET = 'latest'

  # Processing
  PROCESSING_REGION = 'iad'
  LOG_LEVEL = 'INFO'
  HEALTH_CHECK_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = 256
