# Nixpacks configuration for Railway deployment
# Forces fresh dependency installation

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
    "pip install --no-cache-dir --upgrade pip",
    "pip install --no-cache-dir .",
    "pip install --no-cache-dir neo4j>=5.20.0"
]

[phases.build]
cmds = ["python -c 'import neo4j; print(f\"neo4j driver {neo4j.__version__} installed\")'"]
